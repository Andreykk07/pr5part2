version: '3.8'

services:
  gateway:
    image: nginx:alpine
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - catalog-service
      - order-service

  catalog-service:
    build:
      context: ./services/catalog-service
    environment:
      - DATABASE_URL=postgres://catalog_user:catalog_pass@catalog-db:5432/catalog_db
    depends_on:
      catalog-db:
        condition: service_healthy

  order-service:
    build:
      context: ./services/order-service
    environment:
      - DATABASE_URL=postgres://order_user:order_pass@order-db:5432/order_db
      - CATALOG_SERVICE_URL=http://catalog-service:3001
    depends_on:
      order-db:
        condition: service_healthy

  catalog-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: catalog_user
      POSTGRES_PASSWORD: catalog_pass
      POSTGRES_DB: catalog_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catalog_user -d catalog_db"]
      interval: 5s
      timeout: 3s
      retries: 5

  order-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: order_user
      POSTGRES_PASSWORD: order_pass
      POSTGRES_DB: order_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U order_user -d order_db"]
      interval: 5s
      timeout: 3s
      retries: 5
